apiVersion: v1
kind: ConfigMap
metadata:
  name: verifier-web-config
data:
  _features.conf: |
    enabledFeatures = [
        entra
    ]
  web.conf: |
    webHost = "0.0.0.0"
    webPort = 3000
  verifier-service.conf: |
    baseUrl = "http://10.140.15.241"
  entra.conf: |
    callbackUrl = "http://10.140.15.241/entra/verification-callback/"
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: verifier
spec:
  replicas: 1
  selector:
    matchLabels:
      app: verifier
  template:
    metadata:
      labels:
        app: verifier
      annotations:
        deployment/id: '_DEFAULT_DEPLOYMENT_'
    spec:
      containers:
        - name: verifier
          image: waltid/verifier-api:v1.0.2502180906
          volumeMounts:
            - name: verifier-web-config
              mountPath: '/waltid-verifier-api/config/'
              readOnly: true
          ports:
            - containerPort: 3000
              name: http-api
      volumes:
        - name: verifier-web-config
          configMap:
            name: verifier-web-config
---
kind: Service
apiVersion: v1
metadata:
  name: verifier
  annotations:
    networking.gke.io/load-balancer-type: 'Internal'
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app: verifier
  ports:
    - name: http
      port: 80
      targetPort: http-api
      protocol: TCP
